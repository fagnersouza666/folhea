# Production overlay for docker compose.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build

services:
  keycloak:
    command:
      - start
      - --optimized
      - --http-port=8080
      - --http-management-port=9000
      - --import-realm
    environment:
      KC_HOSTNAME_STRICT: "true"
    volumes:
      - ./infra/keycloak/render-realm.sh:/opt/keycloak/render-realm.sh:ro
      - ./infra/keycloak/folhea-realm.prod.template.json:/templates/folhea-realm.template.json:ro
