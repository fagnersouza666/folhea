<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada — Folhea</title>
    <meta name="description" content="A página que você procura não existe no Folhea." />
    <meta name="robots" content="noindex, nofollow" />
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #173f35; background: #f7f1e7; }
      body { box-sizing: border-box; display: grid; min-height: 100vh; margin: 0; padding: 2rem; place-items: center; text-align: center; }
      main { max-width: 32rem; }
      h1 { margin: 0 0 1rem; font-family: Georgia, serif; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; }
      p { color: #53665f; line-height: 1.6; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; border-radius: 999px; color: #fff; background: #173f35; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p aria-hidden="true">404</p>
      <h1>Página não encontrada</h1>
      <p>Esse caminho não existe, mas sua próxima leitura pode começar por aqui.</p>
      <a href="/">Voltar para o Folhea</a>
    </main>
  </body>
</html>
