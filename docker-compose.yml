name: folhea

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-folhea}
      POSTGRES_USER: ${DB_USERNAME:-folhea}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided by an external secret or .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be provided by an external secret or .env}
    volumes:
      - folhea-postgres:/var/lib/postgresql
      - ./infra/postgres/init/10-keycloak-database.sh:/docker-entrypoint-initdb.d/10-keycloak-database.sh:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080", "--http-management-port=9000", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be provided by an external secret or .env}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_HOSTNAME: ${PUBLIC_DOMAIN:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME must be provided by an external secret or .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be provided by an external secret or .env}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    expose:
      - "8080"
      - "9000"
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: backend-runtime
    restart: unless-stopped
    environment:
      DB_USERNAME: ${DB_USERNAME:-folhea}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided by an external secret or .env}
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-folhea}
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/folhea
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-folhea-api}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_TOKEN_ISSUER: ${OIDC_TOKEN_ISSUER:-http://keycloak:8080/realms/folhea}
      CORS_ENABLED: ${CORS_ENABLED:-false}
      SECURITY_CANONICAL_ORIGIN: ${SECURITY_CANONICAL_ORIGIN:?SECURITY_CANONICAL_ORIGIN must be provided}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:?SECURITY_ALLOWED_ORIGINS must be provided}
      JSON_LOGGING: ${JSON_LOGGING:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
    expose:
      - "8080"
    networks:
      - edge
      - private
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: caddy-runtime
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:8080}
      STATIC_ROOT: /srv
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  folhea-postgres:
  caddy-data:
  caddy-config:

networks:
  edge:
    internal: true
  private:
    internal: true
