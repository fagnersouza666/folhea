name: ${COMPOSE_PROJECT_NAME:-folhea}

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    labels:
      ao.session: ${AO_SESSION_ID:-manual}
      ao.spare: "true"
    environment:
      POSTGRES_DB: ${DB_NAME:-folhea}
      POSTGRES_USER: ${DB_USERNAME:-folhea}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided by an external secret or .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be provided by an external secret or .env}
    volumes:
      - folhea-postgres:/var/lib/postgresql
      - ./infra/postgres/init/10-keycloak-database.sh:/docker-entrypoint-initdb.d/10-keycloak-database.sh:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    restart: unless-stopped
    labels:
      ao.session: ${AO_SESSION_ID:-manual}
      ao.spare: "true"
    entrypoint: ["/bin/bash", "/opt/keycloak/render-realm.sh"]
    command: ["start-dev", "--http-port=8080", "--http-management-port=9000", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be provided by an external secret or .env}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      # Keycloak issues public URLs, while the backend uses the private
      # keycloak:8080 address for discovery and token/JWKS back-channel calls.
      KC_HOSTNAME: ${OIDC_PUBLIC_ORIGIN:?OIDC_PUBLIC_ORIGIN must be provided}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?KEYCLOAK_ADMIN_USERNAME must be provided by an external secret or .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be provided by an external secret or .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET must be provided by an external secret or .env}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:?OIDC_PUBLIC_ORIGIN must be provided}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be provided}
    volumes:
      - ./infra/keycloak/render-realm.sh:/opt/keycloak/render-realm.sh:ro
      - ./infra/keycloak/folhea-realm.dev.template.json:/templates/folhea-realm.template.json:ro
    expose:
      - "8080"
      - "9000"
    networks:
      - private
      - identity-egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ $$line == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    labels:
      ao.session: ${AO_SESSION_ID:-manual}
      ao.spare: "true"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be provided by an external secret or .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be provided by an external secret or .env}
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: backend-runtime
    restart: unless-stopped
    labels:
      ao.session: ${AO_SESSION_ID:-manual}
      ao.spare: "true"
    environment:
      # TLS terminates at Caddy; the private BFF listener must accept HTTP.
      QUARKUS_HTTP_INSECURE_REQUESTS: enabled
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-${OIDC_PUBLIC_ORIGIN:-https://${PUBLIC_DOMAIN:-localhost}}}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:?OIDC_PUBLIC_ORIGIN must be provided}
      DB_USERNAME: ${DB_USERNAME:-folhea}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided by an external secret or .env}
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-folhea}
      TRUSTED_PROXIES: ${CADDY_IPV4:-172.30.0.2}
      OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/folhea
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-folhea-api}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET must be provided by an external secret or .env}
      OIDC_TOKEN_STATE_SECRET: ${OIDC_TOKEN_STATE_SECRET:?OIDC_TOKEN_STATE_SECRET must be provided}
      OIDC_LOGOUT_CLEAR_SITE_DATA: ${OIDC_LOGOUT_CLEAR_SITE_DATA:-cache,storage}
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: folhea
      KEYCLOAK_ADMIN_CLIENT_ID: folhea-registration
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be provided}
      OIDC_PUBLIC_AUTHORIZATION_URL: ${OIDC_PUBLIC_AUTHORIZATION_URL:?OIDC_PUBLIC_AUTHORIZATION_URL must be provided}
      OIDC_PUBLIC_LOGOUT_URL: ${OIDC_PUBLIC_LOGOUT_URL:?OIDC_PUBLIC_LOGOUT_URL must be provided}
      OIDC_TOKEN_ISSUER: ${OIDC_TOKEN_ISSUER:-${OIDC_PUBLIC_ISSUER:?OIDC_PUBLIC_ISSUER must be provided}}
      CORS_ENABLED: ${CORS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_ORIGIN:-${SECURITY_CANONICAL_ORIGIN:?SECURITY_CANONICAL_ORIGIN must be provided}}}
      SECURITY_CANONICAL_ORIGIN: ${SECURITY_CANONICAL_ORIGIN:?SECURITY_CANONICAL_ORIGIN must be provided}
      SECURITY_ALLOWED_ORIGINS: ${SECURITY_ALLOWED_ORIGINS:?SECURITY_ALLOWED_ORIGINS must be provided}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be provided}@redis:6379
      SECURITY_STORE_BACKEND: redis
      JSON_LOGGING: ${JSON_LOGGING:-true}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
    expose:
      - "8080"
    networks:
      edge:
        ipv4_address: ${BACKEND_IPV4:-172.30.0.3}
        aliases:
          - backend-edge
      private:
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: caddy-runtime
    restart: unless-stopped
    labels:
      ao.session: ${AO_SESSION_ID:-manual}
      ao.spare: "true"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
      OIDC_PUBLIC_ORIGIN: ${OIDC_PUBLIC_ORIGIN:?OIDC_PUBLIC_ORIGIN must be provided}
      API_UPSTREAM: ${API_UPSTREAM:-http://backend-edge:8080}
      STATIC_ROOT: /srv
      HTTP_SITE_ADDRESS: http://:80
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_IPV4:-172.30.0.2}
      private:
        aliases:
          - caddy
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  folhea-postgres:
  caddy-data:
  caddy-config:

networks:
  edge:
    # Caddy needs host publishing and outbound ACME; backend has no host port.
    internal: false
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.0.0/24}
  private:
    internal: true
  identity-egress:
    # Keycloak needs outbound Google and SMTP; no host ports are published.
    internal: false
