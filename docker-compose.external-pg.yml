# Server profile: existing PostgreSQL belongs to its own project, like AcertoApp.
# Never combine with the standalone/NPM-managed-PG entry profiles.
name: ${COMPOSE_PROJECT_NAME:-folhea-prod}

x-folhea-external-postgres:
  container: ${EXTERNAL_PG_CONTAINER:?Explicit existing PG container required}
  container_id: ${EXTERNAL_PG_CONTAINER_ID:?Observed existing PG container ID required}
  image_id: ${EXTERNAL_PG_IMAGE_ID:?Observed existing PG image ID required}
  version: "16.13"
  network: ${EXTERNAL_PG_NETWORK:?Explicit existing PG network required}
  host: ${EXTERNAL_PG_HOST:?Explicit private PG hostname required}
  port: 5432

services:
  keycloak:
    extends: {file: docker-compose.yml, service: keycloak}
    labels: {ao.spare: "true"}
    image: folhea/keycloak:${FOLHEA_SOURCE_SHA:-external-pg-local}
    build: {context: ., dockerfile: infra/Dockerfile, target: keycloak-runtime}
    command: [start, --optimized, --http-port=8080, --http-management-port=9000, --import-realm]
    depends_on: !reset {}
    mem_limit: 1g
    cpus: 1
    environment:
      KC_HOSTNAME_STRICT: "true"
      KC_DB_URL: jdbc:postgresql://${EXTERNAL_PG_HOST:?Explicit private PG hostname required}:5432/${KEYCLOAK_DB_NAME:-folhea_keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-folhea_keycloak}
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "10"
    volumes:
      - ./infra/keycloak/folhea-realm.prod.template.json:/templates/folhea-realm.template.json:ro
    networks: !override
      private:
      identity-egress:
      postgres-external:

  redis:
    extends: {file: docker-compose.yml, service: redis}
    labels: {ao.spare: "true"}
    mem_limit: 384m
    cpus: 0.5

  backend:
    extends: {file: docker-compose.yml, service: backend}
    labels: {ao.spare: "true"}
    image: folhea/backend:${FOLHEA_SOURCE_SHA:-external-pg-local}
    mem_limit: 768m
    cpus: 2
    environment:
      TRUSTED_PROXIES: ${CADDY_EDGE_IP:?Explicit exclusive Caddy IPv4 required}
      DB_USERNAME: ${DB_USERNAME:-folhea_app}
      DB_JDBC_URL: jdbc:postgresql://${EXTERNAL_PG_HOST:?Explicit private PG hostname required}:5432/${DB_NAME:-folhea}
      QUARKUS_DATASOURCE_JDBC_INITIAL_SIZE: "0"
      QUARKUS_DATASOURCE_JDBC_MIN_SIZE: "0"
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "10"
    depends_on: !override
      keycloak: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks:
      edge:
        ipv4_address: !reset null
      postgres-external:

  caddy:
    extends: {file: docker-compose.yml, service: caddy}
    labels: {ao.spare: "true"}
    image: folhea/caddy:${FOLHEA_SOURCE_SHA:-external-pg-local}
    mem_limit: 128m
    cpus: 0.5
    ports: !reset []
    environment:
      PUBLIC_DOMAIN: folhea.app
      OIDC_PUBLIC_ORIGIN: https://folhea.app
      NPM_PROXY_NETWORK: ${NPM_PROXY_NETWORK:?Explicit existing proxy network required}
      NPM_PROXY_IP: ${NPM_PROXY_IP:?Observed NPM IPv4 required}
      NPM_PROXY_CONTAINER: ${NPM_PROXY_CONTAINER:?Explicit existing proxy container required}
      NPM_PROXY_CONTAINER_ID: ${NPM_PROXY_CONTAINER_ID:?Observed NPM container ID required}
      HTTP_SITE_ADDRESS: !reset null
    volumes:
      - ./infra/Caddyfile.npm:/etc/caddy/Caddyfile:ro
    networks:
      edge:
        ipv4_address: ${CADDY_EDGE_IP:?Explicit exclusive Caddy IPv4 required}
      npm-proxy:
        aliases: [folhea-caddy]

volumes:
  caddy-data:
  caddy-config:

networks:
  private:
    internal: true
  identity-egress:
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:?Explicit exclusive Folhea subnet required}
  npm-proxy:
    external: true
    name: ${NPM_PROXY_NETWORK:?Explicit existing proxy network required}
  postgres-external:
    external: true
    name: ${EXTERNAL_PG_NETWORK:?Explicit existing PG network required}
