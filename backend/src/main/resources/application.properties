quarkus.application.name=folhea-backend
quarkus.http.root-path=/
quarkus.http.auth.proactive=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:folhea}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.health.enabled=true
quarkus.http.host=0.0.0.0
quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.limits.max-body-size=64K
quarkus.http.access-log.enabled=false
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=${QUARKUS_LOG_SQL:false}
quarkus.flyway.migrate-at-start=true
%dev.quarkus.flyway.baseline-on-migrate=true
%test.quarkus.flyway.baseline-on-migrate=true
%prod.quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.clean-at-start=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.write-dates-as-timestamps=false
quarkus.log.console.json.enabled=${JSON_LOGGING:true}
quarkus.log.console.json.excluded-keys=authorization,cookie,set-cookie,access_token,refresh_token,client_secret,password,token,secret
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.category."org.hibernate.type.descriptor.sql".level=WARN
quarkus.http.cors.enabled=${CORS_ENABLED:false}
quarkus.http.cors.origins=${CORS_ORIGINS:https://folhea.com.br}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
quarkus.smallrye-openapi.info-title=Folhea API
quarkus.smallrye-openapi.info-version=0.3.0
quarkus.smallrye-openapi.info-description=API de acompanhamento de leitura do Folhea.
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=false
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=live
quarkus.smallrye-health.readiness-path=ready
quarkus.smallrye-health.extensions.enabled=true
quarkus.otel.enabled=${OTEL_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.micrometer.export.prometheus.enabled=${METRICS_ENABLED:false}
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/folhea}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:folhea-api}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:}
quarkus.oidc.application-type=hybrid
# Discovery and all back-channel calls use the private Keycloak address. The
# browser-facing authorization and logout endpoints are explicitly public so
# Quarkus never leaks the Docker hostname in a redirect.
quarkus.oidc.discovery-enabled=true
quarkus.oidc.authorization-path=${OIDC_PUBLIC_AUTHORIZATION_URL:https://folhea.com.br/realms/folhea/protocol/openid-connect/auth}
quarkus.oidc.token-path=protocol/openid-connect/token
quarkus.oidc.jwks-path=protocol/openid-connect/certs
quarkus.oidc.introspection-path=protocol/openid-connect/token/introspect
quarkus.oidc.user-info-path=protocol/openid-connect/userinfo
quarkus.oidc.end-session-path=${OIDC_PUBLIC_LOGOUT_URL:https://folhea.com.br/realms/folhea/protocol/openid-connect/logout}
quarkus.oidc.token.issuer=${OIDC_TOKEN_ISSUER:https://folhea.com.br/realms/folhea}
quarkus.oidc.token.audience=folhea-api
quarkus.oidc.token.subject-required=true
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.token.required-claims.azp=folhea-api
quarkus.oidc.authentication.redirect-path=/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.remove-redirect-parameters=true
quarkus.oidc.authentication.force-redirect-https-scheme=true
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.cookie-suffix=folhea
quarkus.oidc.authentication.cookie-same-site=LAX
quarkus.oidc.authentication.state-cookie-same-site=LAX
quarkus.oidc.authentication.state-cookie-age=5M
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.nonce-required=true
quarkus.oidc.authentication.fail-on-missing-state-param=true
quarkus.oidc.authentication.id-token-required=true
quarkus.oidc.authentication.cache-control=no-store
quarkus.oidc.logout.path=/auth/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.oidc.token-state-manager.strategy=keep-all-tokens
quarkus.oidc.token-state-manager.encryption-required=true
quarkus.oidc.token-state-manager.encryption-secret=${OIDC_TOKEN_STATE_SECRET:}

# Request boundary. Production keeps the canonical origin fixed at the public
# site; dev/test overrides make direct local requests explicit rather than
# weakening the production default.
folhea.security.canonical-origin=${SECURITY_CANONICAL_ORIGIN:https://folhea.com.br}
folhea.security.allowed-origins=${SECURITY_ALLOWED_ORIGINS:https://folhea.com.br}
folhea.security.csrf.ttl=${SECURITY_CSRF_TTL:PT8H}
folhea.security.max-json-body-bytes=${SECURITY_MAX_JSON_BODY_BYTES:65536}
folhea.security.rate-limit.window=${SECURITY_RATE_LIMIT_WINDOW:PT1M}
folhea.security.rate-limit.login-per-ip=${SECURITY_RATE_LIMIT_LOGIN_PER_IP:10}
folhea.security.rate-limit.mutations-per-ip=${SECURITY_RATE_LIMIT_MUTATIONS_PER_IP:20}
folhea.security.rate-limit.mutations-per-user=${SECURITY_RATE_LIMIT_MUTATIONS_PER_USER:60}
folhea.security.rate-limit.reads-per-user=${SECURITY_RATE_LIMIT_READS_PER_USER:120}
folhea.security.store.backend=${SECURITY_STORE_BACKEND:memory}
quarkus.redis.health.enabled=true

# Quarkus receives an opaque reference to the server-side token state manager;
# this additional __Host cookie is an opaque binding for the server-side CSRF
# repository. Neither cookie is readable by browser JavaScript.
%dev.quarkus.oidc.enabled=false
%dev.quarkus.datasource.password=${DB_PASSWORD:}
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/folhea}
%dev.folhea.security.canonical-origin=http://localhost:8080
%dev.folhea.security.allowed-origins=http://localhost:8080
%dev.quarkus.redis.hosts=${REDIS_URL:redis://127.0.0.1:6379}
%test.quarkus.oidc.enabled=false
%test.quarkus.datasource.username=quarkus
%test.quarkus.datasource.password=quarkus
%test.folhea.security.canonical-origin=http://localhost:8081
%test.folhea.security.allowed-origins=http://localhost:8081
%test.folhea.security.max-json-body-bytes=1024
%test.folhea.security.rate-limit.mutations-per-ip=1000
%test.folhea.security.rate-limit.mutations-per-user=1000
%test.folhea.security.rate-limit.reads-per-user=1000
%test.folhea.security.store.backend=memory
# Hosts stay unset in %test so Redis Dev Services can provision a container.
# An explicit redis://127.0.0.1:6379 disables Dev Services and hides CI failures
# when a workstation redis-server is already listening.
%test.quarkus.redis.devservices.enabled=true
%test.quarkus.redis.devservices.image-name=redis:7-alpine
%prod.quarkus.oidc.enabled=true
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
%prod.folhea.security.store.backend=redis
%prod.quarkus.redis.hosts=${REDIS_URL}
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:18
%test.quarkus.hibernate-orm.database.generation=none
%test.folhea.clock.fixed-instant=2026-09-06T02:30:00Z

# The reverse proxy terminates TLS in production. These headers remain at the
# application boundary as defense in depth.
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-forwarded=false
%prod.quarkus.http.proxy.allow-x-forwarded=true
%prod.quarkus.http.proxy.enable-forwarded-host=true
%prod.quarkus.http.proxy.enable-forwarded-prefix=false
%prod.quarkus.http.proxy.trusted-proxies=${TRUSTED_PROXIES}
%prod.quarkus.http.insecure-requests=redirect
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
%prod.quarkus.http.header."Content-Security-Policy".value=default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'
%prod.quarkus.http.header."X-Content-Type-Options".value=nosniff
%prod.quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
%prod.quarkus.http.header."Permissions-Policy".value=camera=(), microphone=(), geolocation=()
%prod.quarkus.smallrye-openapi.enable=false
