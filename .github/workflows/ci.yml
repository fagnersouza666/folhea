# Pin GitHub Actions to immutable commit SHAs.
# Regenerate with: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '26.11.1'
  JAVA_VERSION: '27'

jobs:
  components:
    name: detect components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      seo: ${{ steps.detect.outputs.seo }}
      playwright: ${{ steps.detect.outputs.playwright }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect complete component contracts
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_npm_scripts() {
            node -e '
              const fs = require("node:fs");
              const [manifest, ...required] = process.argv.slice(1);
              const scripts = JSON.parse(fs.readFileSync(manifest, "utf8")).scripts ?? {};
              process.exit(required.every((name) => typeof scripts[name] === "string") ? 0 : 1);
            ' "$@"
          }

          frontend=false
          if [[ -f frontend/package.json && -f frontend/package-lock.json \
            && -f scripts/ci/validate-api-contract.mjs ]] \
            && has_npm_scripts frontend/package.json lint build build:ssg test:coverage; then
            frontend=true
          fi

          backend=false
          if [[ -f backend/pom.xml && -x backend/mvnw \
            && -f backend/.mvn/wrapper/maven-wrapper.properties ]]; then
            backend=true
          fi

          docker=false
          if [[ -f infra/Dockerfile \
            && -f infra/Caddyfile \
            && -f docker-compose.yml \
            && -f docker-compose.prod.yml \
            && -f .env.example \
            && -f scripts/ci/validate-oidc-surface.mjs \
            && -f infra/keycloak/folhea-realm.dev.template.json \
            && -f infra/keycloak/folhea-realm.prod.template.json \
            && -f frontend/package.json \
            && -f frontend/package-lock.json \
            && -f backend/pom.xml \
            && -x backend/mvnw \
            && -f backend/.mvn/wrapper/maven-wrapper.properties ]] \
            && has_npm_scripts frontend/package.json build; then
            docker=true
          fi

          seo=false
          if [[ "$frontend" == true \
            && -f scripts/ci/validate-seo.mjs \
            && -f infra/Caddyfile ]]; then
            seo=true
          fi

          playwright=false
          if [[ "$frontend" == true && "$backend" == true \
            && -f frontend/playwright.config.ts \
            && -f frontend/e2e/critical.spec.ts \
            && -f frontend/e2e/fixtures.ts ]] \
            && has_npm_scripts frontend/package.json e2e:critical; then
            playwright=true
          fi

          # The v1 monorepo is complete: a deleted/partial component must fail CI.
          for component in "$frontend" "$backend" "$seo" "$playwright" "$docker"; do
            [[ "$component" == true ]] || { echo "::error::Required v1 component contract is missing"; exit 1; }
          done

          printf 'frontend=%s\n' "$frontend" >> "$GITHUB_OUTPUT"
          printf 'backend=%s\n' "$backend" >> "$GITHUB_OUTPUT"
          printf 'seo=%s\n' "$seo" >> "$GITHUB_OUTPUT"
          printf 'playwright=%s\n' "$playwright" >> "$GITHUB_OUTPUT"
          printf 'docker=%s\n' "$docker" >> "$GITHUB_OUTPUT"

  frontend:
    name: frontend
    needs: components
    if: ${{ needs.components.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: test -f package.json && test -f package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --configuration production
      - run: npm run build:ssg -- --configuration production
      - run: npm run test:coverage
      - name: Validate frontend/backend API contract
        run: node ../scripts/ci/validate-api-contract.mjs contract-report.txt
      - name: Regress AUTH navigation and CSRF source contract
        run: node ../scripts/ci/tests/test-auth-contract.mjs
      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-evidence
          path: |
            frontend/coverage/
            frontend/dist/
            frontend/contract-report.txt
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: backend
    needs: components
    if: ${{ needs.components.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: test -x mvnw
      - run: ./mvnw -B clean verify
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-evidence
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 14

  seo:
    name: seo
    needs: [components, frontend]
    if: ${{ needs.components.outputs.seo == 'true' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download SSG artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-test-evidence
          path: frontend
      - name: Locate generated SSG site
        id: site-root
        run: |
          site_file="$(find frontend/dist -type f -name robots.txt -print -quit)"
          test -n "$site_file"
          site_root="${site_file%/*}"
          echo "path=$site_root" >> "$GITHUB_OUTPUT"
      - name: Serve SSG output with Caddy 2.11 for HTTP checks
        run: |
          mkdir -p seo-report
          docker run --detach --rm \
            --name folhea-caddy-seo \
            --publish 4173:80 \
            --env PUBLIC_DOMAIN=:80 \
            --env API_UPSTREAM=http://127.0.0.1:9 \
            --env STATIC_ROOT=/srv \
            --volume "$GITHUB_WORKSPACE/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --volume "$GITHUB_WORKSPACE/${{ steps.site-root.outputs.path }}:/srv:ro" \
            caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
      - name: Validate generated SEO and HTTP responses
        run: node scripts/ci/validate-seo.mjs "${{ steps.site-root.outputs.path }}" seo-report/seo-validation.txt
        env:
          SEO_BASE_URL: http://127.0.0.1:4173
          SEO_REDIRECT_PATH: ${{ vars.SEO_REDIRECT_PATH }}
          SEO_REDIRECT_TARGET: ${{ vars.SEO_REDIRECT_TARGET }}
      - name: Capture Caddy validation logs
        if: always()
        run: docker logs folhea-caddy-seo > seo-report/caddy.log 2>&1 || true
      - name: Stop Caddy validation server
        if: always()
        run: docker rm --force folhea-caddy-seo || true
      - name: Upload SEO evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-evidence
          path: seo-report/
          if-no-files-found: ignore
          retention-days: 14

  playwright:
    name: playwright-critical
    needs: [components, frontend, backend]
    if: ${{ needs.components.outputs.playwright == 'true' && needs.frontend.result == 'success' && needs.backend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:critical
        working-directory: frontend
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: docker
    needs: components
    if: ${{ needs.components.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate OIDC Compose/Caddy surface
        run: node scripts/ci/validate-oidc-surface.mjs
      - name: Validate realm and backup/restore scripts
        run: |
          bash scripts/tests/test-render-realm.sh
          python3 -B -m unittest discover -s scripts/ops/tests -p test_keycloak_auth.py
          bash scripts/ops/tests/test-backup-restore.sh
      - name: Validate private book multipart body limits on actual Caddy
        timeout-minutes: 10
        run: node scripts/ci/tests/test-api-body-limits.mjs
      - name: Validate delayed Caddy creation and bounded cleanup
        timeout-minutes: 2
        run: node scripts/ci/tests/test-caddy-startup.mjs
      - name: Validate product metric SQL on isolated PostgreSQL
        run: bash scripts/ops/tests/test-product-metrics.sh
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - run: docker build --file infra/Dockerfile --tag folhea:ci .
      - run: docker build --file infra/Dockerfile --target caddy-runtime --tag folhea:caddy-ci .
      - run: docker build --file infra/Dockerfile --target keycloak-runtime --tag folhea:keycloak-ci .
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.example config --quiet

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs: [components, frontend, backend, seo, playwright, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require available gates to pass
        env:
          COMPONENTS: ${{ needs.components.result }}
          FRONTEND_EXPECTED: ${{ needs.components.outputs.frontend }}
          BACKEND_EXPECTED: ${{ needs.components.outputs.backend }}
          SEO_EXPECTED: ${{ needs.components.outputs.seo }}
          PLAYWRIGHT_EXPECTED: ${{ needs.components.outputs.playwright }}
          DOCKER_EXPECTED: ${{ needs.components.outputs.docker }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          SEO: ${{ needs.seo.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -u
          printf 'components=%s\nfrontend=%s (expected=%s)\nbackend=%s (expected=%s)\nseo=%s (expected=%s)\nplaywright=%s (expected=%s)\ndocker=%s (expected=%s)\n' \
            "$COMPONENTS" "$FRONTEND" "$FRONTEND_EXPECTED" \
            "$BACKEND" "$BACKEND_EXPECTED" "$SEO" "$SEO_EXPECTED" \
            "$PLAYWRIGHT" "$PLAYWRIGHT_EXPECTED" "$DOCKER" "$DOCKER_EXPECTED"

          failed=0
          if [[ "$COMPONENTS" != success ]]; then
            echo '::error::component detection did not complete successfully'
            failed=1
          fi

          check_gate() {
            local name="$1"
            local expected="$2"
            local result="$3"
            case "$expected" in
              true)
                if [[ "$result" != success ]]; then
                  echo "::error::$name gate was expected to pass, but finished with $result"
                  failed=1
                fi
                ;;
              false)
                if [[ "$result" != skipped ]]; then
                  echo "::error::$name gate was expected to be skipped, but finished with $result"
                  failed=1
                fi
                ;;
              *)
                echo "::error::$name detector output must be true or false, got '$expected'"
                failed=1
                ;;
            esac
          }

          check_gate frontend "$FRONTEND_EXPECTED" "$FRONTEND"
          check_gate backend "$BACKEND_EXPECTED" "$BACKEND"
          check_gate seo "$SEO_EXPECTED" "$SEO"
          check_gate playwright "$PLAYWRIGHT_EXPECTED" "$PLAYWRIGHT"
          check_gate docker "$DOCKER_EXPECTED" "$DOCKER"
          exit "$failed"
