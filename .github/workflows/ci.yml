name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '25'

jobs:
  components:
    name: detect components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      seo: ${{ steps.detect.outputs.seo }}
      playwright: ${{ steps.detect.outputs.playwright }}
      docker: ${{ steps.detect.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect complete component contracts
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_npm_scripts() {
            node -e '
              const fs = require("node:fs");
              const [manifest, ...required] = process.argv.slice(1);
              const scripts = JSON.parse(fs.readFileSync(manifest, "utf8")).scripts ?? {};
              process.exit(required.every((name) => typeof scripts[name] === "string") ? 0 : 1);
            ' "$@"
          }

          frontend=false
          if [[ -f frontend/package.json && -f frontend/package-lock.json ]] \
            && has_npm_scripts frontend/package.json lint build build:ssg test; then
            frontend=true
          fi

          backend=false
          if [[ -f backend/pom.xml && -x backend/mvnw ]]; then
            backend=true
          fi

          docker=false
          if [[ -f infra/Dockerfile ]]; then
            docker=true
          fi

          seo=false
          if [[ "$frontend" == true && -f scripts/ci/validate-seo.mjs ]]; then
            seo=true
          fi

          playwright=false
          if [[ "$frontend" == true && "$backend" == true ]] \
            && has_npm_scripts frontend/package.json e2e:critical; then
            playwright=true
          fi

          printf 'frontend=%s\n' "$frontend" >> "$GITHUB_OUTPUT"
          printf 'backend=%s\n' "$backend" >> "$GITHUB_OUTPUT"
          printf 'seo=%s\n' "$seo" >> "$GITHUB_OUTPUT"
          printf 'playwright=%s\n' "$playwright" >> "$GITHUB_OUTPUT"
          printf 'docker=%s\n' "$docker" >> "$GITHUB_OUTPUT"

  frontend:
    name: frontend
    needs: components
    if: ${{ needs.components.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: test -f package.json && test -f package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --configuration production
      - run: npm run build:ssg -- --configuration production
      - run: npm run test -- --run
      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-evidence
          path: |
            frontend/coverage/
            frontend/dist/
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: backend
    needs: components
    if: ${{ needs.components.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: test -x mvnw
      - run: ./mvnw -B clean verify
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  seo:
    name: seo
    needs: [components, frontend]
    if: ${{ needs.components.outputs.seo == 'true' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download SSG artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-test-evidence
          path: frontend
      - name: Locate generated SSG site
        id: site-root
        run: |
          site_file="$(find frontend/dist -type f -name robots.txt -print -quit)"
          test -n "$site_file"
          site_root="${site_file%/*}"
          echo "path=$site_root" >> "$GITHUB_OUTPUT"
      - name: Serve SSG output for HTTP checks
        run: |
          mkdir -p seo-report
          node scripts/ci/serve-seo.mjs "${{ steps.site-root.outputs.path }}" 4173 > seo-report/server.log 2>&1 &
          echo $! > seo-report/server.pid
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
      - name: Validate generated SEO and HTTP responses
        run: node scripts/ci/validate-seo.mjs "${{ steps.site-root.outputs.path }}" seo-report/seo-validation.txt
        env:
          SEO_BASE_URL: http://127.0.0.1:4173
          SEO_REDIRECT_PATH: ${{ vars.SEO_REDIRECT_PATH }}
          SEO_REDIRECT_TARGET: ${{ vars.SEO_REDIRECT_TARGET }}
      - name: Upload SEO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-evidence
          path: seo-report/
          if-no-files-found: ignore
          retention-days: 14

  playwright:
    name: playwright-critical
    needs: [components, frontend, backend]
    if: ${{ needs.components.outputs.playwright == 'true' && needs.frontend.result == 'success' && needs.backend.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e:critical
        working-directory: frontend
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: docker
    needs: components
    if: ${{ needs.components.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - run: docker build --file infra/Dockerfile --tag folhea:ci .
      - run: docker build --file infra/Dockerfile --target caddy-runtime --tag folhea:caddy-ci .

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs: [components, frontend, backend, seo, playwright, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require available gates to pass
        env:
          COMPONENTS: ${{ needs.components.result }}
          FRONTEND_EXPECTED: ${{ needs.components.outputs.frontend }}
          BACKEND_EXPECTED: ${{ needs.components.outputs.backend }}
          SEO_EXPECTED: ${{ needs.components.outputs.seo }}
          PLAYWRIGHT_EXPECTED: ${{ needs.components.outputs.playwright }}
          DOCKER_EXPECTED: ${{ needs.components.outputs.docker }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          SEO: ${{ needs.seo.result }}
          PLAYWRIGHT: ${{ needs.playwright.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -u
          printf 'components=%s\nfrontend=%s (expected=%s)\nbackend=%s (expected=%s)\nseo=%s (expected=%s)\nplaywright=%s (expected=%s)\ndocker=%s (expected=%s)\n' \
            "$COMPONENTS" "$FRONTEND" "$FRONTEND_EXPECTED" \
            "$BACKEND" "$BACKEND_EXPECTED" "$SEO" "$SEO_EXPECTED" \
            "$PLAYWRIGHT" "$PLAYWRIGHT_EXPECTED" "$DOCKER" "$DOCKER_EXPECTED"

          failed=0
          if [[ "$COMPONENTS" != success ]]; then
            echo '::error::component detection did not complete successfully'
            failed=1
          fi

          check_gate() {
            local name="$1"
            local expected="$2"
            local result="$3"
            if [[ "$expected" == true ]]; then
              if [[ "$result" != success ]]; then
                echo "::error::$name gate was expected to pass, but finished with $result"
                failed=1
              fi
            elif [[ "$result" != skipped ]]; then
              echo "::error::$name gate was expected to be skipped, but finished with $result"
              failed=1
            fi
          }

          check_gate frontend "$FRONTEND_EXPECTED" "$FRONTEND"
          check_gate backend "$BACKEND_EXPECTED" "$BACKEND"
          check_gate seo "$SEO_EXPECTED" "$SEO"
          check_gate playwright "$PLAYWRIGHT_EXPECTED" "$PLAYWRIGHT"
          check_gate docker "$DOCKER_EXPECTED" "$DOCKER"
          exit "$failed"
