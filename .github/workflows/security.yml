name: Security

on:
  pull_request:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ARCHIVE_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$tool_dir/archive.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$tool_dir/archive.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/archive.tar.gz" -C "$tool_dir" gitleaks
          printf '%s\n' "$tool_dir" >> "$GITHUB_PATH"
      - name: Regress secret scan and workflow policy
        run: |
          python3 -B -m unittest discover -s scripts/ci/tests -p 'test_secret_scan.py'
          python3 -B -m unittest discover -s scripts/ci/tests -p 'test_workflow_security.py'
          python3 -B -m unittest discover -s scripts/ci/tests -p 'test_public_image_archive.py'
          python3 -B scripts/ci/verify-public-image-archive.py --check-source
      - name: Scan repository for secrets
        run: python3 -B scripts/ci/scan-secrets.py

  filesystem-scan:
    name: Filesystem vulnerabilities and misconfiguration (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan source and dependency manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Dependency Review uses GitHub's Dependency Graph API. A repository
      # without that feature gets a 403 before the action can run. Skip only
      # this API-backed delta check in that case; Trivy remains a blocking
      # vulnerability scan for the complete checkout above.
      - name: Detect Dependency Graph support
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          response="$(
            gh api --include \
              "repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              2>&1
          )"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$response" | grep -Eq '"message"[[:space:]]*:[[:space:]]*"Forbidden"'; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency Graph is not available for this repository; skipping Dependency Review. Trivy remains blocking for vulnerabilities, secrets, and misconfigurations."
          else
            printf '%s\n' "$response" >&2
            exit "$status"
          fi

      - name: Review introduced dependencies
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
