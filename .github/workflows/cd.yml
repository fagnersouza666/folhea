name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '26.12.0'
  JAVA_VERSION: '27'

jobs:
  release:
    name: build release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend lint and unit tests
        run: |
          npm run lint
          npm run test -- --run
        working-directory: frontend
      - name: Generate production and SSG bundles
        run: |
          npm run build -- --configuration production
          npm run build:ssg -- --configuration production
        working-directory: frontend
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Backend build and tests
        run: ./mvnw -B clean verify
        working-directory: backend
      - name: Build Docker image
        run: |
          umask 077
          python3 scripts/ci/verify-public-image-archive.py --check-source
          docker build --file infra/Dockerfile --target backend-runtime --tag folhea:backend-${{ github.sha }} .
          docker build --file infra/Dockerfile --target caddy-runtime --tag folhea:caddy-${{ github.sha }} .
          docker build --file infra/Dockerfile --target keycloak-runtime --tag folhea:keycloak-${{ github.sha }} .
          docker save folhea:backend-${{ github.sha }} folhea:caddy-${{ github.sha }} folhea:keycloak-${{ github.sha }} | gzip > folhea-images.tar.gz
          python3 scripts/ci/verify-public-image-archive.py folhea-images.tar.gz --expected-tag folhea:backend-${{ github.sha }} --expected-tag folhea:caddy-${{ github.sha }} --expected-tag folhea:keycloak-${{ github.sha }}
      - name: Upload release evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: folhea-images.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: deploy production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deployment
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        if: env.DEPLOY_HOOK != ''
        run: |
          payload="$(jq -n --arg revision "$REVISION" --arg runId "$RUN_ID" '{revision:$revision,runId:$runId,artifact:"release-evidence"}')"
          if ! curl --fail --silent --retry 2 --output /dev/null -X POST --header 'Content-Type: application/json' --data "$payload" "$DEPLOY_HOOK" 2>/dev/null; then
            echo '::error::Production deployment request failed; inspect the private deployment channel.'
            exit 1
          fi
      - name: Explain local deployment contract
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
        if: env.DEPLOY_HOOK == ''
        run: echo 'PRODUCTION_DEPLOY_HOOK is not configured; release artifacts were built but no deployment was triggered.'

  health-check:
    name: production health check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require health check for configured deployment
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          if [[ -n "$DEPLOY_HOOK" && -z "$HEALTHCHECK_URL" ]]; then
            echo "::error::PRODUCTION_HEALTH_URL is required when a deploy hook is configured"
            exit 1
          fi
      - name: Verify liveness and readiness
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          HEALTHCHECK_PATHS: ${{ vars.PRODUCTION_HEALTH_PATHS || '/q/health/live,/q/health/ready' }}
        if: env.HEALTHCHECK_URL != ''
        run: node scripts/ci/health-check.mjs
      - name: Explain health-check contract
        env:
          HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        if: env.HEALTHCHECK_URL == ''
        run: echo 'PRODUCTION_HEALTH_URL is not configured; configure it to make deployment health checks blocking.'
